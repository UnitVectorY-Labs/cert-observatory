{{define "error"}}
<div class="uvy-alert uvy-alert--danger" role="alert">
    <svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#tabler-alert-circle"></use></svg>
    <strong>{{.Title}}</strong>
    {{if .MessageHTML}}
    <p>{{.MessageHTML | trustedHTML}}</p>
    {{else}}
    <p>{{.Message}}</p>
    {{end}}
</div>
{{if .HasCachedResults}}
<p class="co-cached-note">
    Showing cached results from previous successful crawl:
</p>
{{template "results" .CachedData}}
{{end}}
{{end}}
